<div class="component sb">
  <div class="sb-header">
    <p class="sb-desc">Drag a readout onto a panel.<br>Drag one panel onto another to swap them.<br>On Tactical, the clock and the date are panels too.</p>
  </div>
  <div class="sb-face-wrap">
    <div class="sb-face">
      <div class="sb-rail">
        <div class="sb-rail-block sb-rail-1"></div>
        <div class="sb-rail-block sb-rail-2"></div>
        <div class="sb-rail-block sb-rail-top"></div>
        <div class="sb-pill sb-pill-1"></div>
        <div class="sb-pill sb-pill-2"></div>
        <div class="sb-rail-block sb-rail-bottom"></div>
      </div>
      <div class="sb-slots"></div>
      <div class="sb-rail sb-rail-far">
        <div class="sb-rail-block sb-rail-1"></div>
        <div class="sb-rail-block sb-rail-2"></div>
      </div>
    </div>
    <div class="sb-actions">
      <button type="button" class="sb-btn sb-preset" data-preset="default">Default</button>
      <button type="button" class="sb-btn sb-preset" data-preset="activity">Activity</button>
      <button type="button" class="sb-btn sb-preset" data-preset="weather">Weather</button>
      <button type="button" class="sb-btn sb-preset" data-preset="data">Data</button>
      <button type="button" class="sb-btn sb-preset" data-preset="sleep">Sleep</button>
      <button type="button" class="sb-btn sb-preset" data-preset="creator">Creator</button>
      <button type="button" class="sb-btn sb-btn-clear">Clear</button>
    </div>
  </div>
  <div class="sb-palette"></div>
  <input type="hidden" class="sb-value">
</div>
