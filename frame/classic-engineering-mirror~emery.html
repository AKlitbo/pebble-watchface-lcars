<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LCARS Watch Layout, Engineering Mirrored</title>
        <link rel="stylesheet" type="text/css" href="../vendor/the-lcars/assets/classic.css">
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <link rel="stylesheet" type="text/css" href="css/frame.css">
        <link rel="stylesheet" type="text/css" href="css/theme_classic.css">
        <link rel="stylesheet" type="text/css" href="css/engineering.css">
        <link rel="stylesheet" type="text/css" href="css/mirror.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch engineering mirror">
                <div class="wrap" id="gap">
                    <div class="left-frame">
                        <div class="sp sp-fill"></div>
                    </div>
                    <div class="right-frame">
                        <div class="bar-panel">
                            <div class="bar-6"></div>
                            <div class="bar-7"></div>
                            <div class="bar-8"></div>
                            <div class="bar-9"></div>
                            <div class="bar-10"></div>
                        </div>
                        <main></main>
                    </div>
                </div>
                <div class="wrap wrap-top">
                    <div class="left-frame-top">
                        <div class="sp sp-fill"></div>
                    </div>
                    <div class="right-frame-top">
                        <div class="banner"></div>
                        <div class="bar-panel first-bar-panel">
                            <div class="bar-1"></div>
                            <div class="bar-2"></div>
                            <div class="bar-3"></div>
                            <div class="bar-4"></div>
                            <div class="bar-5"></div>
                    </div>
                </div>
                <div class="core">
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                </div>
                <div class="tail-block tail-block-link background-orange"></div>
                <div class="tail-block tail-block-quiet tail-block-panel"></div>
                <div class="tail-seam tail-seam-link"></div>
                <div class="tail-seam tail-seam-quiet"></div>
            </div>
        </div>
        <script>
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
            }
        </script>
    </body>
</html>
