<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LCARS Watch Layout, Transporter</title>
        <link rel="stylesheet" type="text/css" href="../vendor/the-lcars/assets/classic.css">
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <link rel="stylesheet" type="text/css" href="css/frame.css">
        <link rel="stylesheet" type="text/css" href="css/theme_mono.css">
        <link rel="stylesheet" type="text/css" href="css/transporter.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch transporter">
                <div class="rail rail-left"></div>
                <div class="rail rail-right"></div>
                <div class="strip-top strip-top-a"></div>
                <div class="strip-top strip-top-b"></div>
                <div class="strip-top strip-top-c"></div>
                <div class="strip-foot strip-foot-a"></div>
                <div class="strip-foot strip-foot-b"></div>
                <div class="strip-foot strip-foot-c"></div>
                <div class="fillet fillet-tl"></div>
                <div class="fillet fillet-tr"></div>
                <div class="fillet fillet-bl"></div>
                <div class="fillet fillet-br"></div>
                <div class="cf cf-bar"></div>
                <div class="cf cf-cap"></div>
                <div class="cf cf-side cf-side-top"></div>
                <div class="cf cf-side cf-side-mark background-orange"></div>
                <div class="cf cf-side cf-side-low"></div>
                <div class="cf cf-fillet-top"></div>
                <div class="cf cf-fillet-low"></div>
                <div class="cf cf-foot cf-foot-elbow"></div>
                <div class="cf cf-foot cf-foot-1"></div>
                <div class="cf cf-foot cf-foot-2"></div>
                <div class="cf cf-foot cf-foot-3"></div>
                <div class="cf cf-foot cf-foot-4"></div>
                <div class="cf cf-foot cf-foot-5"></div>
                <div class="cells cells-left">
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                </div>
                <div class="cells cells-right">
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                    <div class="seam-line"></div>
                </div>
                <div class="block block-left block-reading"></div>
                <div class="block block-right block-reading"></div>
                <div class="seam seam-reading block-left"></div>
                <div class="seam seam-reading block-right"></div>
                <div class="block block-left block-state background-orange"></div>
                <div class="block block-right block-state background-orange"></div>
                <div class="seam seam-state block-left"></div>
                <div class="seam seam-state block-right"></div>
            </div>
        </div>
        <script>
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
            }
        </script>
    </body>
</html>
