name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  # build each watchface (regenerates the manifest, compiles the TS pkjs, runs pebble build).
  # one job per face so a failing face does not block the others' artifacts
  pebble:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        face: [lcars-stardate]
    steps:
      - uses: actions/checkout@v7

      # paf fills paf/ from the framework tag in paf.config.json and installs node_modules from the committed lock
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
        with:
          face: ${{ matrix.face }}

      - uses: AKlitbo/pebble-app-framework/.github/actions/setup-pebble@v4.0.0
        with:
          face: ${{ matrix.face }}

      # tee'd because the SDK's memory report is printed during the link and is the only place
      # the heap figure exists. shell: bash for pipefail, or a failed build would pass as long as
      # tee succeeded
      - name: Build Watchface
        shell: bash
        run: paf build ${{ matrix.face }} | tee build-${{ matrix.face }}.log

      # runs after a failed build too, so a face that broke still shows up as missing its rows
      - name: Report Memory
        if: always()
        uses: AKlitbo/pebble-app-framework/.github/actions/report-memory@v4.0.0
        with:
          face: ${{ matrix.face }}
          log: build-${{ matrix.face }}.log

      - uses: actions/upload-artifact@v7
        with:
          name: pbw-${{ matrix.face }}
          path: |
            targets/${{ matrix.face }}*/build/*.pbw
          if-no-files-found: error

  memory:
    runs-on: ubuntu-latest
    needs: pebble
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Render Memory
        uses: AKlitbo/pebble-app-framework/.github/actions/render-memory@v4.0.0

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf lint
      # passes with one line until the face turns Prettier on in paf.config.json
      - run: paf format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf typecheck

  # the generated files the face commits, such as the Clay components and thumbnails, still match
  # what the framework's generators would write
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf check
